name: Optional Crowdin source upload

# Git is authoritative. Automatic exports would overwrite direct translations
# and source uploads currently exceed the Crowdin plan's string allowance.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  upload-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs --check
      - uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
